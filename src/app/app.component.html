<!-- TopBar 固定在页面顶部，不参与滚动 -->
<app-top-bar></app-top-bar>

<!-- 滚动容器 -->
<div class="app-container" #appContainer (scroll)="onScroll($event)">
  <!-- 第一页：主内容页面 -->
  <div class="page-section main-content">
    <div class="center-container" [class.loaded]="isLoaded">
      <img src="favicon.webp" alt="Seimo Logo" class="logo-image">
      <h1 class="title">Seimo</h1>
      <p class="subtitle">不负热爱，奔赴山河</p>
    </div>
  </div>
  
  <!-- 第二页：空白页面 -->
  <div class="page-section blank-page">
    <div class="page-content">
      <div class="text-line-1">开发是生活</div>
      <div class="text-line-2">绝不是工作</div>
    </div>
    <img src="laptop.webp" alt="Laptop" class="center-image" #centerImage>
    <div class="tech-logos">
      <i class="devicon-python-plain colored tech-icon tech-icon-0"></i>
      <i class="devicon-java-plain colored tech-icon tech-icon-1"></i>
      <i class="devicon-kotlin-plain colored tech-icon tech-icon-2"></i>
      <i class="devicon-vuejs-plain colored tech-icon tech-icon-3"></i>
      <i class="devicon-lua-plain colored tech-icon tech-icon-4"></i>
      <i class="devicon-docker-plain colored tech-icon tech-icon-5"></i>
      <i class="devicon-cplusplus-plain colored tech-icon tech-icon-6"></i>
      <span class="ellipsis tech-icon tech-icon-7">...</span>
    </div>
  </div>
  
  <!-- 第三页：白色背景页面 -->
  <div class="page-section third-page">
    <div class="third-page-content">
      <h2 class="third-page-title">第三页</h2>
      <p class="third-page-subtitle">这是一个白色背景的页面</p>
    </div>
  </div>
  
  <router-outlet></router-outlet>
</div>
